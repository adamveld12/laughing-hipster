#-------------------------------------------------------------------------------#
# vim:set ft=sh                                     ("set modeline" in ~/.exrc) #
#-------------------------------------------------------------------------------#
# Author       : Adam Veldhousen                               The USA          #
#-------------------------------------------------------------------------------#

# default to bash
# set -g default-command "/bin/bash --login"
# OSX
set -g default-shell "/opt/homebrew/bin/bash"
set -g default-command "/opt/homebrew/bin/bash --login"

set -g default-terminal "xterm-256color"

# advertise truecolor so nvim/etc. can use termguicolors
set -as terminal-features ",xterm-256color:RGB"

# set esc-wait off, so vim works
set-option -sg escape-time 0

# Enable passthrough for escape sequences (tmux 3.2+)
set -g allow-passthrough on

# Enable extended keys (tmux 3.2+)
set -s extended-keys on

# Enable xterm-style key sequences
set -g xterm-keys on

# Reports focus events
set -g focus-events on

#set prefix to ctrl-a
set-option -g prefix C-a
unbind-key C-b
bind-key -N "Send prefix (C-a) to the application" C-a send-prefix

# some nice ops
set-option -g bell-action any
set-option -g history-limit 10000
set-option -g set-titles on
set-option -g set-titles-string ' #I-#W '
set-option -g repeat-time 500
set-option -g visual-bell on
set-option -g base-index 1

set-option buffer-limit 10

#window options
#set-window-option -g utf8 on
set-window-option -g clock-mode-style 24
set-window-option -g monitor-activity on
set-window-option -g monitor-bell on
set-window-option -g automatic-rename on
set-window-option -g mouse on
#set -g pane-active-border-fg green
#set -g pane-border-fg white
#set -g pane-border-bg white
#set -g pane-active-border-fg cyan
#set -g pane-active-border-bg cyan


# Window nav (base-index is 1, so 0 is window 10)
unbind-key 1          ; bind-key -N "Select window 1"  1          select-window -t 1
unbind-key 2          ; bind-key -N "Select window 2"  2          select-window -t 2
unbind-key 3          ; bind-key -N "Select window 3"  3          select-window -t 3
unbind-key 4          ; bind-key -N "Select window 4"  4          select-window -t 4
unbind-key 5          ; bind-key -N "Select window 5"  5          select-window -t 5
unbind-key 6          ; bind-key -N "Select window 6"  6          select-window -t 6
unbind-key 7          ; bind-key -N "Select window 7"  7          select-window -t 7
unbind-key 8          ; bind-key -N "Select window 8"  8          select-window -t 8
unbind-key 9          ; bind-key -N "Select window 9"  9          select-window -t 9
unbind-key 0          ; bind-key -N "Select window 10" 0          select-window -t 10
#maybe bind alt key + num
bind-key -r -N "Next window"          C-n      next-window
bind-key -r -N "Previous window"      C-p      previous-window
bind-key    -N "Last (previous) window"  Tab   last-window
bind-key    -N "Last (previous) session" BTab  switch-client -l

#pane selection
unbind-key left            ; bind-key -r -N "Select pane left"  left   select-pane -L
unbind-key right           ; bind-key -r -N "Select pane right" right  select-pane -R
unbind-key up              ; bind-key -r -N "Select pane up"    up     select-pane -U
unbind-key down            ; bind-key -r -N "Select pane down"  down   select-pane -D
unbind-key D               ; bind-key -N "Choose session/window/pane from tree" D choose-tree -Z

#vim binding
unbind-key h               ; bind-key -r -N "Select pane left (vim)"  h  select-pane -L
unbind-key l               ; bind-key -r -N "Select pane right (vim)" l  select-pane -R
unbind-key k               ; bind-key -r -N "Select pane up (vim)"    k  select-pane -U
unbind-key j               ; bind-key -r -N "Select pane down (vim)"  j  select-pane -D

#pane resizing
unbind-key J            ; bind-key -r -N "Resize pane down by 5"  J  resize-pane -D 5
unbind-key K            ; bind-key -r -N "Resize pane up by 5"    K  resize-pane -U 5
unbind-key L            ; bind-key -r -N "Resize pane right by 5" L  resize-pane -R 5
unbind-key H            ; bind-key -r -N "Resize pane left by 5"  H  resize-pane -L 5

# window splitting
unbind-key %
unbind-key '"'
bind-key -N "Split pane top/bottom (start dir)"   M-i  split-window -v
bind-key -N "Split pane left/right (start dir)"   M-s  split-window -h
unbind-key i              ; bind-key -N "Split pane top/bottom (current dir)" i  split-window -v -c "#{pane_current_path}"
unbind-key s              ; bind-key -N "Split pane left/right (current dir)" s  split-window -h -c "#{pane_current_path}"
unbind-key n              ; bind-key -N "New window in ~/code"  n  new-window -c "$HOME/code"
unbind-key &              ; bind-key -N "Kill window (confirm)"  w  confirm-before -p "Kill Window #W? (y/n)" kill-window
unbind-key x              ; bind-key -N "Kill pane (confirm)"    x  confirm-before -p "Kill Pane #P? (y/n)" kill-pane
unbind-key $              ; bind-key -N "Rename session"         S  command-prompt -p "Rename session:" -I "#S" "rename-session -- '%%'"
unbind-key ,              ; bind-key -N "Rename window"          r  command-prompt -p "Rename window:" -I "#W" "rename-window -- '%%'"

#nice bindings
bind-key -N "Reload tmux config"     R    { source-file ~/.config/tmux/tmux.conf ; display-message "config reloaded" }
unbind-key q               ; bind-key -N "List all key bindings"  q    list-keys
bind-key -N "Show pane numbers"      M-q  display-panes

# Agent magic
unbind-key c               ; bind-key -N "Claude popup in current dir" c  display-popup -E -w 75% -h 75% -d "#{pane_current_path}" claude

# prefix + g toggles a persistent scratch popup per session
bind-key -N "Toggle scratch popup session" g if-shell -F '#{m:Popup_*,#{session_name}}' {
    detach-client
} {
    display-popup -E -w 85% -h 85% -d "#{pane_current_path}" \
        "env -u TMUX tmux new-session -A -s 'Popup_#{session_name}'"
}

# copy/paste
unbind [                   ; bind -N "Enter copy mode" Escape copy-mode
unbind p                   ; bind -N "Paste most recent buffer" p paste-buffer


set-option -g update-environment 'DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY DBUS_SESSION_BUS_ADDRESS'


#status bar
set-option -g status-keys vi
set-option -g status-interval 1
set-option -g status-justify left

set-option -g status-left-length 65
#set-option -g status-left-bg blue
set-option -g status-left ' #h | Adam Veldhousen '

#set-option -g status-right-bg green
set-option -g status-right ' tmux is rad | %A %B %d, %Y  %Ts '

source-file ~/.config/tmux/.tmux-themepack/powerline/block/orange.tmuxtheme
